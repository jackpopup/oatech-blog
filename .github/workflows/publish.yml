name: Auto Publish Blog Post

on:
  schedule:
    - cron: '0 0 * * 1,3,5'  # 월/수/금 UTC 00:00 (KST 09:00)
  workflow_dispatch:
    inputs:
      category:
        description: '카테고리'
        required: false
        type: choice
        options:
          - ''
          - '운영팁'
          - '창업가이드'
          - '트렌드'
          - '사례'
      count:
        description: '생성할 글 수'
        required: false
        default: '1'
        type: choice
        options:
          - '1'
          - '2'
          - '3'

permissions:
  contents: write

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v5
        with:
          version: '10'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Generate blog post
        run: |
          CATEGORY_ARG=""
          COUNT_ARG="--count=1"
          if [ -n "$INPUT_CATEGORY" ]; then
            CATEGORY_ARG="--category=$INPUT_CATEGORY"
          fi
          if [ -n "$INPUT_COUNT" ]; then
            COUNT_ARG="--count=$INPUT_COUNT"
          fi
          npx tsx scripts/generate.ts $CATEGORY_ARG $COUNT_ARG
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          INPUT_CATEGORY: ${{ inputs.category }}
          INPUT_COUNT: ${{ inputs.count }}

      - name: Validate generated MDX
        run: npx tsx scripts/validate-mdx.ts

      - name: Commit and Push
        run: |
          git config user.name "oatech-blog-bot"
          git config user.email "bot@oatech.co"
          git add content/posts/ scripts/keywords.json
          git diff --staged --quiet || git commit -m "publish: auto-generated blog post [skip ci]"
          git push
